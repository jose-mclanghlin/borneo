{{- if .Values.secretStore.enabled }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.secretStore.name | default "aws-secrets" }}
  namespace: {{ .Values.namespace.name }}
spec:
  provider:
    {{- if eq .Values.secretStore.provider.type "aws" }}
    aws:
      service: {{ .Values.secretStore.provider.aws.service | default "SecretsManager" }}
      region: {{ .Values.secretStore.provider.aws.region }}
      role: {{ .Values.secretStore.provider.aws.role }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.secretStore.serviceAccount.name | default .Values.serviceAccount.name | default "secrets-reader" }}
            namespace: {{ .Values.namespace.name }}
    {{- else }}
    {{- toYaml .Values.secretStore.provider | nindent 4 }}
    {{- end }}
{{- end }}