app:
  namespace:
    enabled: true
    name: "bilbao"
    labels:
      owner: "devops"
      team: "plataform-devops"

  configMap:
    enabled: true
    name: "bilbao-config-map"
    annotations:
      description: "Configuration for the Bilbao service"
    data:
      NGINX_PORT: "8080"
      APP_ENV: "dev"

  service:
    name: "bilbao-service"
    type: ClusterIP
    port: 8080
    targetPort: 8080
    selector:
      app: "bilbao"
  
  secret:
    enabled: true
    name: "bilbao-secrets"
    annotations: 
      description: "Secrets for the Bilbao service"    
    labels:
      name: "bilbao-secrets"
    data:
       API_KEY: "ak_7FJ9dP2mQ4Xb81tRv6Kc3wLhZ0SgNEB"
       DB_PASSWORD: "jkl.123456*"
       
  deployment:
    name: "bilbao-deployment"
    replicas: 3
    minReadySeconds: 0
    revisionHistoryLimit: 3
    progressDeadlineSeconds: 600
    labels:
      app: "bilbao"
    enableStrategy: false
    enablePodSecurityContext: false
    serviceAccount: {enabled: false}
    initContainers: []
    podAnnotations: {}
    nodeSelector: {}
    container:
      name: "nginx-container"
      image: nginx:1.27-alpine
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 8080
      envFrom:
        - configMapRef:
            name: "bilbao-config-map"
        - secretRef:
            name: "bilbao-secrets"
      resources:
        limits:
          cpu: "500m"
          memory: "512Mi"
        requests:
          cpu: "200m"
          memory: "256Mi"
      enableStaticEnv: false
      enableVolumesMounts: false
      enableContainerSecurityContext: false
      env: []
      volumeMounts: []
  
  secretStore:
    enabled: false

  serviceAccount:
    enabled: false
  
  ingress:
    enabled: false